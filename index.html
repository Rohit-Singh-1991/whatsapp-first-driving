<style>
:root{--g:#075e54;--g2:#128c7e;--mint:#e7f8f3;--ink:#17212b;--muted:#687783;--bg:#f4f7f8;--card:#fff;--line:#e2e8eb;--danger:#c62828;--amber:#b76b00;--shadow:0 10px 35px rgba(22,40,50,.08)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:68px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:11px;align-items:center;font-weight:800;font-size:20px}.wa{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--g);font-size:20px}.top small{opacity:.8}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:68px;height:calc(100vh - 68px)}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:10px;color:#50606a;margin:3px 0;font-weight:650}.nav.active,.nav:hover{background:var(--mint);color:var(--g)}.nav span{margin-right:10px}.main{padding:26px;max-width:1450px;width:100%;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.pagehead h1{margin:0;font-size:26px}.pagehead p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:9px;font-weight:700}.btn.primary{background:var(--g);border-color:var(--g);color:#fff}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .ico{width:40px;height:40px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:19px}.stat b{display:block;font-size:26px;margin-top:8px}.muted{color:var(--muted)}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:13px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:#61717a;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:#fbfcfc}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:750;background:#eef2f4;color:#53636d}.pill.green{background:#e5f7ef;color:#08734e}.pill.amber{background:#fff3dc;color:#9a5b00}.pill.red{background:#fdeaea;color:#a52222}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:750;color:#53636d;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d7e0e4;background:#fff;border-radius:9px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #128c7e16}.radio{display:flex;gap:8px}.radio label{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;cursor:pointer}.radio input{width:auto}.quote{background:linear-gradient(135deg,#e8f8f3,#f7fffc);border:1px solid #c9ebe0;border-radius:12px;padding:16px}.quote strong{font-size:32px;color:var(--g)}.chat{max-width:680px;margin:auto;background:#efeae2;border-radius:16px;overflow:hidden;border:1px solid #d9d1c7}.chathead{background:#075e54;color:#fff;padding:13px 16px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#c8e6dc;color:#075e54;font-weight:800}.messages{padding:18px;min-height:280px;background:radial-gradient(#e4ddd5 1px,transparent 1px);background-size:16px 16px}.msg{max-width:78%;background:#fff;padding:10px 12px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px #0001}.msg.me{margin-left:auto;background:#d9fdd3}.msg .time{font-size:10px;color:#87958d;text-align:right;margin-top:4px}.chatbar{padding:10px;background:#f0f2f5;display:flex;gap:8px}.chatbar input{border-radius:22px}.timeline{display:grid;gap:0}.tl{display:grid;grid-template-columns:25px 1fr;gap:10px;padding-bottom:16px}.dot{width:14px;height:14px;border-radius:50%;background:var(--g);margin-top:3px;box-shadow:0 0 0 4px var(--mint)}.tl:not(:last-child) .dot:after{content:"";display:block;width:2px;height:45px;background:#b7d9cf;margin:14px 0 0 6px}.empty{text-align:center;padding:40px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#17212b;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:99}.modal{position:fixed;inset:0;background:#0b182066;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal .box{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:22px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.close{border:0;background:#eef2f4;border-radius:50%;width:32px;height:32px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f8f3,#f4f7f8)}.loginbox{background:#fff;padding:30px;border-radius:18px;box-shadow:var(--shadow);width:min(420px,92vw)}.loginbox h1{margin:0 0 8px}.mini{font-size:12px}.switch{display:flex;background:#eef2f4;padding:4px;border-radius:10px}.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;font-weight:700}.switch button.active{background:#fff;color:var(--g);box-shadow:0 1px 5px #0001}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-250px;z-index:30;transition:.2s;width:235px}.side.open{left:0}.main{padding:18px}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}@media(max-width:650px){.top{padding:0 14px}.top small{display:none}.g4,.g3,.g2,.row{grid-template-columns:1fr}.pagehead{flex-direction:column}.card{padding:16px}.main{padding:14px}.chat{border-radius:10px}}

@media (max-width:1000px){#menu{display:inline-grid!important;place-items:center;min-width:40px;min-height:40px}.top{gap:10px}.brand{min-width:0}.shell,.main,.pagehead,.card{min-width:0}.side{max-width:85vw}}
@media (max-width:650px){.top{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 12px}.top .pill{margin-left:auto}.brand{font-size:18px;gap:8px}.wa{flex:0 0 34px;width:34px;height:34px}.main{padding:12px}.pagehead h1{font-size:clamp(21px,6vw,26px)}.btn{min-height:42px;max-width:100%;white-space:normal}.modal{padding:10px}.modal .box{padding:16px;max-height:calc(100dvh - 20px)}.tablewrap{max-width:100%;overscroll-behavior-x:contain}}
@media (max-width:380px){.top{gap:7px}.brand{font-size:16px}.main{padding:9px}.card{padding:12px}.g4,.g3,.g2,.row{gap:12px}.pagehead{gap:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
<div id="login" class="login hidden"><div class="loginbox"><div class="brand" style="color:var(--g);margin-bottom:20px"><span class="wa">💬</span> DriveConnect</div><h1>Operations login</h1><p class="muted">Demo credentials: <b>admin</b> / <b>admin123</b></p><div class="form"><div><label>Username</label><input id="lu" value="admin"></div><div><label>Password</label><input id="lp" type="password" value="admin123"></div><button class="btn primary" onclick="login()">Sign in</button></div></div></div>
<div id="app" class="app">
<header class="top"><div class="brand"><button class="btn" style="background:#ffffff18;color:#fff;border:0;display:none" id="menu" onclick="toggleSide()">☰</button><span class="wa">💬</span> DriveConnect</div><small>WhatsApp-first driver booking platform</small><span class="pill green" style="background:#e5f7ef;color:#08734e">Phase 1 Pilot</span></header>
<div class="shell"><aside class="side" id="side">
<button class="nav active" data-page="dashboard">📊 <span>Dashboard</span></button>

<script>
const KEY='driveconnect_mvp_v4';
const defaultData={pricing:{base:100,perKm:18,night:75,cancel:100},drivers:[
{id:'D101',name:'Raj Kumar',phone:'9876543210',vehicle:'Sedan',status:'Available',rating:4.9,trips:124,online:true},
{id:'D102',name:'Amit Sharma',phone:'9876501234',vehicle:'SUV',status:'Busy',rating:4.8,trips:98,online:true},
{id:'D103',name:'Suresh Yadav',phone:'9811122233',vehicle:'Hatchback',status:'Available',rating:4.7,trips:76,online:true},
{id:'D104',name:'Vikas Singh',phone:'9898989898',vehicle:'Sedan',status:'Offline',rating:4.9,trips:151,online:false}],bookings:[
{id:'DC1001',customer:'Priya Mehta',phone:'9871111111',date:'2026-10-05',time:'16:30',pickup:'Dwarka Sector 10',drop:'IGI Airport T3',vehicle:'Sedan',km:18,fare:424,payment:'UPI',status:'On the way',driver:'D102',created:'15:10'},
{id:'DC1002',customer:'Rahul Verma',phone:'9899999999',date:'2026-10-05',time:'17:00',pickup:'Janakpuri',drop:'Gurugram Cyber Hub',vehicle:'SUV',km:31,fare:658,payment:'Cash',status:'Confirmed',driver:'',created:'15:01'},
{id:'DC1003',customer:'Anita Singh',phone:'9810101010',date:'2026-10-05',time:'18:15',pickup:'Palam',drop:'New Delhi Railway Station',vehicle:'Hatchback',km:16,fare:388,payment:'UPI',status:'Completed',driver:'D103',created:'14:22'}]};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultData); let page='dashboard'; let quote=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>t.style.display='none',2400)}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function todayISO(){const d=new Date();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day}
function setToday(id){const el=document.getElementById(id);if(el&&!el.value)el.value=todayISO()}
function nav(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;nav();document.getElementById('side').classList.remove('open')});
function layout(title,sub,actions=''){return '<div class="pagehead"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div>'+actions+'</div></div>'}
function render(){const m=document.getElementById('main');({dashboard:dashboard,bookings:bookings,customers:customers,drivers:drivers,payments:payments,pricing:pricing,reports:reports,settings:settings,customer:customer,driverapp:driverapp}[page]||dashboard)(m)}
function dashboard(m){const bs=data.bookings;const active=bs.filter(x=>!['Completed','Cancelled'].includes(x.status)).length;const rev=bs.filter(x=>x.status==='Completed').reduce((a,x)=>a+x.fare,0);m.innerHTML=layout('Operations dashboard','One place to manage bookings, drivers, payments and trips','<button class="btn primary" onclick="newBooking()">＋ New booking</button>')+
'<div class="grid g4"><div class="card stat"><div>Active bookings<b>'+active+'</b><span class="muted">Live pipeline</span></div><div class="ico">📋</div></div><div class="card stat"><div>Available drivers<b>'+data.drivers.filter(x=>x.status==='Available').length+'</b><span class="muted">Ready to assign</span></div><div class="ico">🚗</div></div><div class="card stat"><div>Completed revenue<b>'+money(rev)+'</b><span class="muted">Demo data</span></div><div class="ico">💰</div></div><div class="card stat"><div>Customer bookings<b>'+bs.length+'</b><span class="muted">All time in demo</span></div><div class="ico">💬</div></div></div>'+
'<div class="grid g2 section"><div class="card"><h2>Live booking pipeline</h2>'+pipeline()+ '</div><div class="card"><h2>Driver availability</h2>'+driverMini()+'</div></div>'}
function pipeline(){if(!data.bookings.length)return '<div class="empty">No bookings</div>';return '<div class="tablewrap"><table class="table"><tr><th>Booking</th><th>Customer</th><th>Route</th><th>Status</th></tr>'+data.bookings.slice(0,6).map(b=>'<tr><td><b>'+b.id+'</b></td><td>'+b.customer+'</td><td>'+b.pickup+' → '+b.drop+'</td><td><span class="pill '+pill(b.status)+'">'+b.status+'</span></td></tr>').join('')+'</table></div>'}
function driverMini(){return data.drivers.map(d=>'<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)"><span><b>'+d.name+'</b><br><span class="muted">'+d.vehicle+' · ★ '+d.rating+'</span></span><span class="pill '+(d.status==='Available'?'green':d.status==='Busy'?'amber':'')+'">'+d.status+'</span></div>').join('')}
function pill(s){return s==='Completed'||s==='Accepted'||s==='On the way'||s==='Trip started'?'green':s==='Confirmed'||s==='Arrived'?'amber':s==='Cancelled'?'red':''}
function bookings(m){m.innerHTML=layout('Bookings','Create, assign, track and complete every trip','<button class="btn primary" onclick="newBooking()">＋ New booking</button>')+'<div class="card"><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Customer</th><th>Schedule</th><th>Route</th><th>Fare</th><th>Payment</th><th>Driver</th><th>Status</th><th></th></tr>'+data.bookings.map(b=>'<tr><td><b>'+b.id+'</b></td><td>'+b.customer+'<br><span class="muted">'+b.phone+'</span></td><td>'+b.date+' '+b.time+'</td><td>'+b.pickup+' → '+b.drop+'</td><td>'+money(b.fare)+'</td><td>'+b.payment+'</td><td>'+(data.drivers.find(d=>d.id===b.driver)?.name||'Unassigned')+'</td><td><span class="pill '+pill(b.status)+'">'+b.status+'</span></td><td><button class="btn" onclick="viewBooking(\''+b.id+'\')">Open</button></td></tr>').join('')+'</table></div></div>'}
function customers(m){const names=[...new Map(data.bookings.map(b=>[b.phone,{name:b.customer,phone:b.phone,count:data.bookings.filter(x=>x.phone===b.phone).length,last:b.pickup+' → '+b.drop}])).values()];m.innerHTML=layout('Customers','Customer history and booking relationships')+'<div class="card"><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Phone</th><th>Bookings</th><th>Last route</th></tr>'+names.map(x=>'<tr><td><b>'+x.name+'</b></td><td>'+x.phone+'</td><td>'+x.count+'</td><td>'+x.last+'</td></tr>').join('')+'</table></div></div>'}
function drivers(m){m.innerHTML=layout('Drivers','Manage availability, vehicles and driver status','<button class="btn primary" onclick="newDriver()">＋ Add driver</button>')+'<div class="grid g2">'+data.drivers.map(d=>'<div class="card"><div style="display:flex;justify-content:space-between"><div><h2 style="margin:0">'+d.name+'</h2><p class="muted">'+d.id+' · '+d.phone+'</p></div><span class="pill '+(d.status==='Available'?'green':d.status==='Busy'?'amber':'')+'">'+d.status+'</span></div><div class="statgrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px"><div class="stat"><span class="muted">Vehicle</span><b style="font-size:15px">'+d.vehicle+'</b></div><div class="stat"><span class="muted">Rating</span><b style="font-size:15px">★ '+d.rating+'</b></div><div class="stat"><span class="muted">Trips</span><b style="font-size:15px">'+d.trips+'</b></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="toggleDriver(\''+d.id+'\')">'+(d.online?'Set offline':'Set online')+'</button><button class="btn" onclick="editDriver(\''+d.id+'\')">Edit</button></div></div>').join('')+'</div>'}
function payments(m){const total=data.bookings.reduce((a,b)=>a+b.fare,0),paid=data.bookings.filter(b=>b.payment==='UPI'&&b.status==='Completed').reduce((a,b)=>a+b.fare,0);m.innerHTML=layout('Payments','Track payment method and collection status')+'<div class="grid g3"><div class="card stat"><div>Total booking value<b>'+money(total)+'</b></div><div class="ico">₹</div></div><div class="card stat"><div>UPI collected<b>'+money(paid)+'</b></div><div class="ico">💳</div></div><div class="card stat"><div>Cash bookings<b>'+data.bookings.filter(b=>b.payment==='Cash').length+'</b></div><div class="ico">💵</div></div></div><div class="card section"><div class="tablewrap"><table class="table"><tr><th>Booking</th><th>Customer</th><th>Amount</th><th>Method</th><th>Status</th></tr>'+data.bookings.map(b=>'<tr><td>'+b.id+'</td><td>'+b.customer+'</td><td>'+money(b.fare)+'</td><td>'+b.payment+'</td><td><span class="pill '+(b.status==='Completed'?'green':'amber')+'">'+(b.status==='Completed'?'Collected':'Pending')+'</span></td></tr>').join('')+'</table></div></div>'}
function pricing(m){m.innerHTML=layout('Pricing','Configure the fare rules used by the booking engine','<button class="btn primary" onclick="savePricing()">Save pricing</button>')+'<div class="card"><div class="grid g2"><div><label>Base fare</label><input id="pbase" type="number" value="'+data.pricing.base+'"></div><div><label>Per km</label><input id="pkm" type="number" value="'+data.pricing.perKm+'"></div><div><label>Night surcharge</label><input id="pnight" type="number" value="'+data.pricing.night+'"></div><div><label>Cancellation fee</label><input id="pcancel" type="number" value="'+data.pricing.cancel+'"></div></div><p class="muted mini">Formula: base fare + distance × per-km rate + applicable surcharge. Vehicle multiplier is applied during quote.</p></div>'}
function reports(m){const completed=data.bookings.filter(b=>b.status==='Completed'),rev=completed.reduce((a,b)=>a+b.fare,0);m.innerHTML=layout('Reports','Simple operational and revenue summary','<button class="btn" onclick="window.print()">Print report</button>')+'<div class="grid g3"><div class="card"><span class="muted">Completed trips</span><b style="font-size:30px;display:block;margin-top:8px">'+completed.length+'</b></div><div class="card"><span class="muted">Revenue</span><b style="font-size:30px;display:block;margin-top:8px">'+money(rev)+'</b></div><div class="card"><span class="muted">Average fare</span><b style="font-size:30px;display:block;margin-top:8px">'+money(completed.length?rev/completed.length:0)+'</b></div></div><div class="card section"><h2>Booking status breakdown</h2>'+['Confirmed','Accepted','On the way','Arrived','Trip started','Completed','Cancelled'].map(s=>'<div style="display:flex;align-items:center;gap:12px;margin:10px 0"><span style="width:110px">'+s+'</span><div style="height:9px;background:#e8edef;border-radius:99px;flex:1"><div style="width:'+Math.min(100,data.bookings.filter(b=>b.status===s).length*18)+'%;height:100%;background:var(--g2);border-radius:99px"></div></div><b>'+data.bookings.filter(b=>b.status===s).length+'</b></div>').join('')+'</div>'}
function settings(m){m.innerHTML=layout('Settings','Business configuration and demo controls')+'<div class="grid g2"><div class="card"><h2>Business profile</h2><div class="form"><div><label>Business name</label><input id="biz" value="DriveConnect"></div><div><label>Service area</label><input value="Delhi NCR"></div><div><label>Support WhatsApp</label><input value="+91 99104 74663"></div><button class="btn primary" onclick="toast(&quot;Business settings saved&quot;)">Save settings</button></div></div><div class="card"><h2>Production integrations</h2><div class="steps" style="display:grid;gap:10px"><div>🟢 <b>Frontend + workflow demo</b> — live</div><div>🟡 <b>WhatsApp Cloud API</b> — connect credentials/webhook</div><div>🟡 <b>Google Maps</b> — distance, route and live location</div><div>🟡 <b>Payment gateway</b> — UPI/card/settlement verification</div><div>🟡 <b>OTP / authentication</b> — production identity layer</div></div></div></div>'}
function customer(m){m.innerHTML=layout('Customer WhatsApp','Simulate the complete customer conversation')+'<div class="chat"><div class="chathead"><div class="avatar">D</div><div><b>DriveConnect</b><br><small>online · booking assistant</small></div></div><div class="messages" id="msgs"><div class="msg"><b>DriveConnect</b><br>Hi! 👋 I can help you book a driver.<br><br>Send your pickup and destination to get an estimated fare.<div class="time">now</div></div></div><div class="chatbar"><input id="chatInput" placeholder="Type pickup, destination or message..." onkeydown="if(event.key===&quot;Enter&quot;)sendChat()"><button class="btn primary" onclick="sendChat()">Send</button></div></div><div class="card section"><h2>Customer booking form</h2><div class="grid g2"><div class="form"><div class="row"><div><label>Name</label><input id="cname" value="Demo Customer"></div><div><label>Phone</label><input id="cphone" value="9910474663"></div></div><div class="row"><div><label>Pickup</label><input id="cpick" value="Dwarka Sector 10"></div><div><label>Destination</label><input id="cdrop" value="IGI Airport T3"></div></div><div class="row"><div><label>Date</label><input id="cdate" type="date" value="'+todayISO()+'"></div><div><label>Time</label><input id="ctime" type="time" value="16:30"></div></div><div><label>Vehicle</label><select id="cvehicle"><option>Sedan</option><option>SUV</option><option>Hatchback</option></select></div><div class="radio"><label><input type="radio" name="pay" value="UPI" checked> UPI</label><label><input type="radio" name="pay" value="Cash"> Cash</label></div><button class="btn primary" onclick="customerQuote()">Get fare</button></div><div id="customerQuote"><div class="empty">Enter booking details and generate a fare.</div></div></div></div>'}
function driverapp(m){const b=data.bookings.find(x=>x.status==='Confirmed'&&!x.driver)||data.bookings.find(x=>['Accepted','On the way','Arrived','Trip started'].includes(x.status));m.innerHTML=layout('Driver app','Driver receives jobs and moves the trip through each status','<span class="pill green">Driver online</span>')+'<div class="grid g2"><div class="card"><h2>Incoming job</h2>'+(b?'<p><b>'+b.id+'</b> · '+b.customer+'</p><p class="muted">'+b.pickup+' → '+b.drop+'</p><p><b>'+money(b.fare)+'</b> · '+b.vehicle+' · '+b.payment+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="driverAction(\''+b.id+'\',\'accept\')">Accept</button><button class="btn" onclick="driverAction(\''+b.id+'\',\'reject\')">Reject</button></div>':'<div class="empty">No new driver request. Create a customer booking to test dispatch.</div>')+'</div><div class="card"><h2>Trip status</h2><div class="timeline">'+['Accepted','On the way','Arrived','Trip started','Completed'].map((s,i)=>'<div class="tl"><div class="dot"></div><div><b>'+s+'</b><div class="muted">'+(b&&b.status===s?'Current status':'Tap the action when the trip reaches this stage')+'</div>'+(b&&((s==='On the way'&&b.status==='Accepted')||(s==='Arrived'&&b.status==='On the way')||(s==='Trip started'&&b.status==='Arrived')||(s==='Completed'&&b.status==='Trip started'))?'<button class="btn" style="margin-top:7px" onclick="setStatus(\''+b.id+'\',\''+s+'\')">Mark '+s+'</button>':'')+'</div></div>').join('')+'</div></div></div>'}
function newBooking(){openModal('<div class="modalhead"><h2>New booking</h2><button class="close" onclick="closeModal()">×</button></div><div class="form" style="margin-top:16px"><div class="row"><div><label>Customer name</label><input id="nbname" value="Demo Customer"></div><div><label>Phone</label><input id="nbphone" value="9910474663"></div></div><div class="row"><div><label>Pickup</label><input id="nbpick" value="Dwarka Sector 10"></div><div><label>Destination</label><input id="nbdrop" value="IGI Airport T3"></div></div><div class="row"><div><label>Date</label><input id="nbdate" type="date" value="'+todayISO()+'"></div><div><label>Time</label><input id="nbtime" type="time" value="16:30"></div></div><div class="row"><div><label>Vehicle</label><select id="nbveh"><option>Sedan</option><option>SUV</option><option>Hatchback</option></select></div><div><label>Estimated distance (km)</label><input id="nbkm" type="number" value="18"></div></div><div class="radio"><label><input type="radio" name="npay" value="UPI" checked> UPI</label><label><input type="radio" name="npay" value="Cash"> Cash</label></div><button class="btn primary" onclick="createBooking()">Create booking</button></div>')}
function createBooking(){const name=document.getElementById('nbname').value.trim(),phone=document.getElementById('nbphone').value.trim(),pickup=document.getElementById('nbpick').value.trim(),drop=document.getElementById('nbdrop').value.trim(),date=document.getElementById('nbdate').value||todayISO(),time=document.getElementById('nbtime').value;if(!name||!phone||!pickup||!drop||!date||!time){toast('Please complete all booking details');return}if(!/^[0-9+\s-]{10,15}$/.test(phone)){toast('Enter a valid phone number');return}const v=document.getElementById('nbveh').value,km=+document.getElementById('nbkm').value||1,mul=v==='SUV'?1.35:v==='Hatchback'?.9:1;const fare=Math.round((data.pricing.base+km*data.pricing.perKm)*mul);const b={id:'DC'+Math.floor(1000+Math.random()*8999),customer:document.getElementById('nbname').value,phone:document.getElementById('nbphone').value,date:document.getElementById('nbdate').value,time:document.getElementById('nbtime').value,pickup:document.getElementById('nbpick').value,drop:document.getElementById('nbdrop').value,vehicle:v,km,fare,payment:document.querySelector('input[name=npay]:checked').value,status:'Confirmed',driver:'',created:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};data.bookings.unshift(b);save();closeModal();page='bookings';nav();toast('Booking '+b.id+' created')}
async function customerQuote(){const name=document.getElementById('cname').value.trim(),phone=document.getElementById('cphone').value.trim(),pickup=document.getElementById('cpick').value.trim(),drop=document.getElementById('cdrop').value.trim(),date=document.getElementById('cdate').value||todayISO(),time=document.getElementById('ctime').value;if(!name||!phone||!pickup||!drop||!date||!time){toast('Please complete all booking details');return}if(!/^[0-9+\s-]{10,15}$/.test(phone)){toast('Enter a valid phone number');return}const v=document.getElementById('cvehicle').value;let km=18;const box=document.getElementById('customerQuote');box.innerHTML='<div class="empty">Calculating route and fare…</div>';try{const r=await fetch('/api/maps/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:pickup,destination:drop})});const d=await r.json();if(r.ok&&Number.isFinite(d.distanceKm)&&d.distanceKm>0)km=d.distanceKm}catch(e){}const mul=v==='SUV'?1.35:v==='Hatchback'?.9:1;const fare=Math.round((data.pricing.base+km*data.pricing.perKm)*mul);quote={v,km,fare};const pay=document.querySelector('input[name=pay]:checked').value;box.innerHTML='<div class="quote"><div class="muted">Estimated fare · '+km+' km · '+v+'</div><strong>'+money(fare)+'</strong><p class="muted">Payment: '+pay+'. '+(pay==='UPI'?'Secure Razorpay checkout will open after confirmation.':'Pay cash to the driver after the trip.')+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="confirmCustomer()">'+(pay==='UPI'?'Continue to secure payment':'Confirm booking')+'</button><button class="btn" onclick="demoConfirmCustomer()">Demo: confirm without payment</button></div></div>'}
async function confirmCustomer(){const pay=document.querySelector('input[name=pay]:checked').value;const b={id:'DC'+Math.floor(1000+Math.random()*8999),customer:document.getElementById('cname').value,phone:document.getElementById('cphone').value,date:document.getElementById('cdate').value,time:document.getElementById('ctime').value,pickup:document.getElementById('cpick').value,drop:document.getElementById('cdrop').value,vehicle:quote.v,km:quote.km,fare:quote.fare,payment:pay,status:'Confirmed',driver:'',created:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};if(pay==='Cash'){data.bookings.unshift(b);save();showCustomerConfirmation(b);return}try{const r=await fetch('/api/razorpay/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:Math.round(b.fare*100),receipt:b.id,booking_id:b.id})});const order=await r.json();if(!r.ok)throw new Error(order.error||'Unable to start payment');const options={key:order.key_id,amount:order.amount,currency:order.currency,name:'DriveConnect',description:'Driver booking '+b.id,order_id:order.id,prefill:{name:b.customer,contact:b.phone},theme:{color:'#075e54'},handler:async function(resp){const vr=await fetch('/api/razorpay/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(resp)});const result=await vr.json();if(!vr.ok||!result.verified)throw new Error(result.error||'Payment verification failed');b.payment='UPI / Razorpay';b.paymentId=result.payment_id;b.orderId=result.order_id;data.bookings.unshift(b);save();showCustomerConfirmation(b);toast('Payment verified and booking confirmed')},modal:{ondismiss:()=>toast('Payment window closed')}};const rz=new Razorpay(options);rz.on('payment.failed',e=>toast(e.error?.description||'Payment failed'));rz.open()}catch(e){toast(e.message||'Payment could not be started')}}
function demoConfirmCustomer(){if(!quote){toast('Generate a fare first');return}const b={id:'DC'+Math.floor(1000+Math.random()*8999),customer:document.getElementById('cname').value,phone:document.getElementById('cphone').value,date:document.getElementById('cdate').value||todayISO(),time:document.getElementById('ctime').value,pickup:document.getElementById('cpick').value,drop:document.getElementById('cdrop').value,vehicle:quote.v,km:quote.km,fare:quote.fare,payment:'Demo / Not charged',status:'Confirmed',driver:'',created:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};data.bookings.unshift(b);save();showCustomerConfirmation(b);toast('Demo booking '+b.id+' created — no payment taken')}
function showCustomerConfirmation(b){document.getElementById('customerQuote').innerHTML='<div class="quote"><span class="pill green">Confirmed</span><h2>Booking '+b.id+'</h2><p>'+b.pickup+' → '+b.drop+'</p><p><b>'+money(b.fare)+'</b> · '+b.payment+'</p><button class="btn" onclick="page=\'bookings\';nav()">Open in business dashboard</button></div>'}
function sendChat(){const i=document.getElementById('chatInput'),v=i.value.trim();if(!v)return;document.getElementById('msgs').insertAdjacentHTML('beforeend','<div class="msg me">'+esc(v)+'<div class="time">now</div></div>');i.value='';setTimeout(()=>document.getElementById('msgs').insertAdjacentHTML('beforeend','<div class="msg">Thanks! Please use the booking form below to enter your pickup, destination and vehicle. I will calculate the fare for you.<div class="time">now</div></div>'),300)}
function viewBooking(id){const b=data.bookings.find(x=>x.id===id);const opts=data.drivers.filter(d=>d.online&&d.status!=='Busy').map(d=>'<option value="'+d.id+'" '+(d.id===b.driver?'selected':'')+'>'+d.name+' · '+d.vehicle+' · ★'+d.rating+'</option>').join('');openModal('<div class="modalhead"><h2>Booking '+b.id+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid g2" style="margin-top:15px"><div><p><b>'+b.customer+'</b><br>'+b.phone+'</p><p>'+b.pickup+' → '+b.drop+'</p><p>'+b.date+' at '+b.time+' · '+b.vehicle+'</p><p><b>'+money(b.fare)+'</b> · '+b.payment+'</p></div><div><label>Assign driver</label><select id="assign">'+(opts||'<option value="">No available drivers</option>')+'</select><button class="btn primary" style="margin-top:8px;width:100%" onclick="assignDriver(\''+b.id+'\')">Save assignment</button><label style="margin-top:14px">Trip status</label><select id="bstatus">'+['Confirmed','Accepted','On the way','Arrived','Trip started','Completed','Cancelled'].map(s=>'<option '+(s===b.status?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn" style="margin-top:8px;width:100%" onclick="saveStatus(\''+b.id+'\')">Update status</button></div></div>')}
function assignDriver(id){const b=data.bookings.find(x=>x.id===id),d=data.drivers.find(x=>x.id===document.getElementById('assign').value);if(!d){toast('Select an available driver');return}b.driver=d.id;if(b.status==='Confirmed')b.status='Accepted';d.status='Busy';save();closeModal();nav();toast(d.name+' assigned to '+b.id)}
function saveStatus(id){const b=data.bookings.find(x=>x.id===id),s=document.getElementById('bstatus').value;b.status=s;if(s==='Completed'||s==='Cancelled'){const d=data.drivers.find(x=>x.id===b.driver);if(d)d.status='Available'}save();closeModal();nav();toast('Booking status updated')}
function setStatus(id,s){const b=data.bookings.find(x=>x.id===id);if(!b)return;b.status=s;if(s==='Completed'){const d=data.drivers.find(x=>x.id===b.driver);if(d){d.status='Available';d.trips++}}save();nav();toast('Trip marked '+s)}
function driverAction(id,a){const b=data.bookings.find(x=>x.id===id);if(a==='reject'){b.status='Cancelled';save();nav();toast('Booking rejected');return}const d=data.drivers.find(x=>x.online&&x.status==='Available');if(d){b.driver=d.id;b.status='Accepted';d.status='Busy';save();nav();toast('Booking accepted by '+d.name)}}
function toggleDriver(id){const d=data.drivers.find(x=>x.id===id);d.online=!d.online;d.status=d.online?'Available':'Offline';save();nav();toast(d.name+' is '+d.status.toLowerCase())}
function newDriver(){openModal('<div class="modalhead"><h2>Add driver</h2><button class="close" onclick="closeModal()">×</button></div><div class="form" style="margin-top:15px"><div class="row"><div><label>Name</label><input id="dn"></div><div><label>Phone</label><input id="dp"></div></div><div><label>Vehicle</label><select id="dv"><option>Sedan</option><option>SUV</option><option>Hatchback</option></select></div><button class="btn primary" onclick="addDriver()">Add driver</button></div>')}
function addDriver(){const n=document.getElementById('dn').value.trim();if(!n){toast('Enter driver name');return}data.drivers.push({id:'D'+Math.floor(100+Math.random()*899),name:n,phone:document.getElementById('dp').value,vehicle:document.getElementById('dv').value,status:'Available',rating:5,trips:0,online:true});save();closeModal();nav();toast('Driver added')}
function editDriver(id){const d=data.drivers.find(x=>x.id===id);openModal('<div class="modalhead"><h2>Edit driver</h2><button class="close" onclick="closeModal()">×</button></div><div class="form" style="margin-top:15px"><div><label>Name</label><input id="edn" value="'+d.name+'"></div><div><label>Phone</label><input id="edp" value="'+d.phone+'"></div><div><label>Vehicle</label><select id="edv">'+['Sedan','SUV','Hatchback'].map(v=>'<option '+(v===d.vehicle?'selected':'')+'>'+v+'</option>').join('')+'</select></div><button class="btn primary" onclick="saveDriver(\''+id+'\')">Save</button></div>')}
function saveDriver(id){const d=data.drivers.find(x=>x.id===id);d.name=document.getElementById('edn').value;d.phone=document.getElementById('edp').value;d.vehicle=document.getElementById('edv').value;save();closeModal();nav();toast('Driver updated')}
function savePricing(){data.pricing.base=+document.getElementById('pbase').value;data.pricing.perKm=+document.getElementById('pkm').value;data.pricing.night=+document.getElementById('pnight').value;data.pricing.cancel=+document.getElementById('pcancel').value;save();toast('Pricing saved')}
function openModal(x){document.getElementById('modalbox').innerHTML=x;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function resetDemo(){if(confirm('Reset all demo data?')){data=structuredClone(defaultData);save();page='dashboard';nav();toast('Demo reset')}
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
window.addEventListener('resize',()=>document.getElementById('menu').style.display=innerWidth<1000?'inline-block':'none');document.getElementById('menu').style.display=innerWidth<1000?'inline-block':'none';render();
</script>
</body></html>
